name: Pull USGS creek data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2020-10-01"
      end:
        description: "End date (YYYY-MM-DD) — leave blank for now"
        default: ""
      sites:
        description: "USGS site numbers, space-separated — leave blank for all"
        default: ""

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull USGS data
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: |
          ARGS="--start ${{ inputs.start }}"
          if [ -n "${{ inputs.end }}" ];   then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          if [ -n "${{ inputs.sites }}" ]; then ARGS="$ARGS --sites ${{ inputs.sites }}"; fi
          python usgs_pull.py $ARGS
      - name: Save the CSVs for download
        uses: actions/upload-artifact@v4
        with:
          name: usgs-data
          path: data/usgs/
